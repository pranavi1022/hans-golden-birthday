<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Send Hans a birthday wish! Leave a message for her golden birthday celebration 💛">
    <meta name="theme-color" content="#D4AF37">
    <title>Send a Wish 💛 | Hans's Golden Birthday</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Wishes Page Styles -->
    <link rel="stylesheet" href="css/wishes-page.css">
</head>
<body>
    <div class="wishes-page">
        <!-- Floating particles background -->
        <div class="wishes-particles" aria-hidden="true"></div>

        <!-- Main form card -->
        <div class="wishes-form-card" id="wishes-form-card">
            <h1 class="wishes-form-title">Send Hans a Birthday Wish 💛</h1>
            <p class="wishes-form-subtitle">Leave a note for her golden birthday wall ✨</p>

            <form id="wishes-form" autocomplete="off">
                <div class="wishes-field">
                    <label class="wishes-label" for="wish-name">Your Name</label>
                    <input
                        type="text"
                        id="wish-name"
                        class="wishes-input"
                        placeholder="e.g. A Friend"
                        required
                        maxlength="50"
                    >
                </div>

                <div class="wishes-field">
                    <label class="wishes-label" for="wish-message">Your Message</label>
                    <textarea
                        id="wish-message"
                        class="wishes-textarea"
                        placeholder="Write something from the heart..."
                        required
                        maxlength="300"
                        rows="4"
                    ></textarea>
                    <div class="wishes-char-count"><span id="char-count">0</span>/300</div>
                </div>

                <button type="submit" class="wishes-submit" id="wishes-submit">
                    <span class="wishes-submit-text">Send Your Wish 💌</span>
                    <span class="wishes-submit-loading" style="display:none;">Sending...</span>
                </button>
            </form>
        </div>

        <!-- Success state (hidden by default) -->
        <div class="wishes-success" id="wishes-success" style="display:none;">
            <div class="success-checkmark">
                <div class="success-circle"></div>
                <div class="success-check"></div>
            </div>
            <h2 class="wishes-success-title">Wish Sent! 💛✨</h2>
            <p class="wishes-success-text">Your note will appear on Hans's birthday wall.<br>Thank you for making her day golden!</p>
            <button class="wishes-another" id="wishes-another">Send Another Wish</button>
        </div>
    </div>

    <!-- Firebase SDK (compat version for simplicity) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- Wishes logic (shared config) -->
    <script src="js/wishes.js"></script>

    <script>
    /* ==============================================================
     *  WISHES PAGE — Form Handling
     * ============================================================== */
    (function() {
      const form = document.getElementById('wishes-form');
      const formCard = document.getElementById('wishes-form-card');
      const successCard = document.getElementById('wishes-success');
      const submitBtn = document.getElementById('wishes-submit');
      const submitText = submitBtn.querySelector('.wishes-submit-text');
      const submitLoading = submitBtn.querySelector('.wishes-submit-loading');
      const nameInput = document.getElementById('wish-name');
      const msgInput = document.getElementById('wish-message');
      const charCount = document.getElementById('char-count');
      const anotherBtn = document.getElementById('wishes-another');

      // Character count
      msgInput.addEventListener('input', function() {
        charCount.textContent = msgInput.value.length;
      });

      // Form submission
      form.addEventListener('submit', function(e) {
        e.preventDefault();

        const name = nameInput.value.trim();
        const message = msgInput.value.trim();
        if (!name || !message) return;

        // Show loading state
        submitBtn.disabled = true;
        submitText.style.display = 'none';
        submitLoading.style.display = 'inline';

        submitWish(name, message)
          .then(function() {
            // Show success
            formCard.style.display = 'none';
            successCard.style.display = 'flex';
          })
          .catch(function(err) {
            console.error('[wishes] Error:', err);
            alert('Something went wrong. Please try again!');
          })
          .finally(function() {
            submitBtn.disabled = false;
            submitText.style.display = 'inline';
            submitLoading.style.display = 'none';
          });
      });

      // Send another wish
      anotherBtn.addEventListener('click', function() {
        form.reset();
        charCount.textContent = '0';
        successCard.style.display = 'none';
        formCard.style.display = 'block';
      });

      // Create floating particles
      var particlesContainer = document.querySelector('.wishes-particles');
      for (var i = 0; i < 30; i++) {
        var particle = document.createElement('div');
        particle.className = 'wish-particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 8 + 's';
        particle.style.animationDuration = (5 + Math.random() * 10) + 's';
        particle.style.fontSize = (8 + Math.random() * 16) + 'px';
        particle.style.opacity = (0.1 + Math.random() * 0.3);
        particle.textContent = ['✨', '💛', '⭐', '🌟', '💫'][Math.floor(Math.random() * 5)];
        particlesContainer.appendChild(particle);
      }
    })();
    </script>
</body>
</html>
